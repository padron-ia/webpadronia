server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ocultar la versión del servidor: no hay motivo para regalarla.
    server_tokens off;

    # ── Compresión ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               image/svg+xml application/xml+rss;

    # ── Cabeceras de seguridad ──────────────────────────────────
    # La web anterior no servía ni una. Para quien vende infraestructura, eso es la
    # mancha en el traje.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP a medida de lo que este sitio carga de verdad: tipografías de Google,
    # el script de Umami y las llamadas al servicio de recados. Nada más.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://monitorizacion-umami.pqtiji.easypanel.host; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://monitorizacion-umami.pqtiji.easypanel.host https://recados-sandy.vercel.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Redirecciones de las URL viejas ─────────────────────────
    # La SPA no permitía 301 de servidor. Ahora sí: las rutas del sitio anterior no
    # mueren en un 404, van a su equivalente.
    location = /gimnasios     { return 301 /; }
    location = /entrenadores  { return 301 /; }
    location = /restaurantes  { return 301 /; }
    location = /gestorias     { return 301 /despachos; }

    # El portal y el centro ya no viven aquí: se van a su propio subdominio.
    location /portal { return 301 https://portal.padron-ia.es$request_uri; }
    location /centro { return 301 https://portal.padron-ia.es$request_uri; }

    # ── Caché ───────────────────────────────────────────────────
    # Los ficheros con hash en el nombre pueden cachearse para siempre. Antes se
    # servían con no-cache y cada visita se los descargaba otra vez.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # El HTML se revalida siempre: es lo que cambia al desplegar.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # El fichero de verificación de Google y el sitemap, sin sorpresas.
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600" always; }
    location ~* ^/google[a-f0-9]+\.html$ { add_header Cache-Control "public, max-age=3600" always; }

    # ── Rutas ───────────────────────────────────────────────────
    # Astro genera una carpeta por página, así que basta con probar el directorio.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
