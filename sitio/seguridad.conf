# Cabeceras de seguridad.
#
# Van en un fichero aparte porque en nginx `add_header` NO se hereda: en cuanto un
# bloque location declara uno propio, DESCARTA todos los del padre. Como la raíz acaba
# sirviendo /index.html y ese bloque pone su Cache-Control, sin este include se quedaba
# sin HSTS, sin CSP y sin nada. Detectado en el dominio temporal el 18-ago-2026, antes
# de tocar padron-ia.es.
#
# Regla: TODO bloque que use add_header tiene que incluir este fichero.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://monitorizacion-umami.pqtiji.easypanel.host; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://monitorizacion-umami.pqtiji.easypanel.host https://recados-sandy.vercel.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
